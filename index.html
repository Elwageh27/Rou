<title>Complete Denture Quiz 🦷</title>
<style>
:root{--bg:#f2f8f8;--card:#fff;--tx:#1b2b2b;--mut:#5d7272;--pr:#0f8b8d;--ok:#1f9d55;--okb:#dff5e8;--no:#d64545;--nob:#fde4e4;--bd:#d3e2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1b;--card:#172526;--tx:#e6f1f1;--mut:#9bb4b4;--pr:#3cc3c6;--ok:#4fd48a;--okb:#14382a;--no:#ff7a7a;--nob:#3b1b1b;--bd:#2a3f40}}
:root[data-theme="dark"]{--bg:#0f1a1b;--card:#172526;--tx:#e6f1f1;--mut:#9bb4b4;--pr:#3cc3c6;--ok:#4fd48a;--okb:#14382a;--no:#ff7a7a;--nob:#3b1b1b;--bd:#2a3f40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
.w{max-width:620px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.5rem;margin:8px 0 4px;text-align:center}
.sub{color:var(--mut);text-align:center;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
button{font:inherit;color:inherit;cursor:pointer}
.ch{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:13px 14px;margin:0 0 10px;text-align:start}
.ch:hover{border-color:var(--pr)}
.ch b{direction:ltr}
.ch small{color:var(--mut)}
.all{background:var(--pr);color:#fff;border-color:var(--pr)}
.all small{color:#e9ffff}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--pr);width:0;transition:width .3s}
.q{direction:ltr;text-align:left;font-size:1.1rem;font-weight:600;margin:0 0 14px}
.o{display:block;direction:ltr;text-align:left;width:100%;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin:0 0 9px}
.o:not(:disabled):hover{border-color:var(--pr)}
.o.ok{background:var(--okb);border-color:var(--ok)}
.o.no{background:var(--nob);border-color:var(--no)}
.o:disabled{cursor:default;color:var(--tx)}
.fb{border-radius:12px;padding:14px;margin-top:6px}
.fb.ok{background:var(--okb);border:1px solid var(--ok)}
.fb.no{background:var(--nob);border:1px solid var(--no)}
.fb h3{margin:0 0 6px}
.fb .ans{direction:ltr;text-align:left;font-weight:700;margin:6px 0}
.nx{display:block;width:100%;margin-top:14px;background:var(--pr);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:700}
.big{font-size:3rem;text-align:center;margin:6px 0}
.sc{font-size:1.6rem;font-weight:800;text-align:center;margin:0 0 6px}
.msg{text-align:center;color:var(--mut);margin:0 0 16px}
.ex{display:block;white-space:pre-line;margin-top:8px;line-height:1.9}
.back{background:none;border:0;color:var(--mut);margin-top:12px;width:100%}
</style>
</head>

<div class="w" id="app"></div>
<script>
var CH=["Introduction","Anatomy & Landmarks","Impressions & Trays","Post Dam & Relief","Retention & Stability","Mandibular Movements"];
var LV=["سهل 🟢","وسط 🟡","صعب 🔴"];
// [chapter, level, question, correct, wrong1, wrong2, wrong3, explanation]
var Q=[
[0,0,"The surface of the denture that fits on the tissues is called the:","Fitting (basal) surface","Polished surface","Occlusal surface","Denture flange","السؤال بيسأل عن اسم السطح اللي بيلزق على النسج. ده الـ Fitting surface، وبيتسمى كمان Basal / Tissue / Impression surface."],
[0,0,"A denture constructed BEFORE extraction and inserted at the time of tooth removal is called:","Immediate denture","Partial denture","Fixed denture","Complete denture","الـ Immediate denture بتتعمل قبل الخلع وبتتركب وقت الخلع نفسه، وده اللي السؤال بيوصفه."],
[0,1,"Which of the following is a LABORATORY step (done without the patient)?","Construction of special trays","Final impression","Jaw relation registration","Try-in stage","السؤال عن خطوة معملية. الـ Special tray بتتعمل في المعمل، أما final impression وjaw relation وtry-in فكلهم clinical بوجود المريض."],
[0,2,"Which statement about the polished surface is correct?","It includes the labial, buccal and lingual surfaces of the teeth","It contacts the opposing dentition","It is also called the basal surface","It faces the residual ridge","الـ Polished هي السطح الخارجي وبتشمل أسطح الأسنان (labial, buccal, lingual). اللي بيلمس المقابل هو الـ Occlusal، واللي بيواجه الـ ridge هو الـ Fitting."],
[1,0,"The ala-tragus (Camper’s) line helps in orientation of:","The posterior occlusal plane","The anterior occlusal plane","The vertical dimension","The midline","خط Camper من الأنف للـ tragus بيظبط الـ posterior occlusal plane. أما الـ interpupillary line فبيظبط الـ anterior plane."],
[1,0,"The primary stress-bearing area of the mandibular arch is the:","Buccal shelf","Crest of the residual ridge","Mylohyoid ridge","Retromolar pad","الـ Buccal shelf هي الـ primary stress bearing في الفك السفلي، لأنها أفقية (عمودية على قوى المضغ) ومن عظم compact."],
[1,1,"Why should the incisive papilla be relieved?","To avoid pressure on the nasopalatine nerves and vessels (burning sensation)","Because it is the primary stress-bearing area","Because it guides the posterior palatal seal","Because it contains minor salivary gland ducts","الـ papilla فوق الـ incisive foramen اللي بيعدي منه nasopalatine nerves وvessels. الضغط عليها بيعمل burning sensation فبنعملها relief."],
[1,1,"The posterior border of the maxillary denture should extend how far posterior to the fovea palatinae?","2 mm","5 mm","10 mm","Exactly at the fovea","الـ posterior border (الـ vibrating line) بيبقى حوالي 2 mm وراء الـ fovea palatinae."],
[1,2,"Overextension of the lingual flange at the palatoglossal arch causes:","Sore throat","Numbness of the lip","Midline fracture","Angular cheilitis","الـ distolingual border قريب من الـ palatoglossal arch، فلو الـ flange زاد هناك بيحصل sore throat."],
[1,2,"In Angle Class II (retruded mandible), the mento-labial sulcus shows:","An acute angle","An obtuse angle","A straight (180°) angle","No sulcus","Class I = obtuse خفيف، Class II = acute، Class III = تقريباً straight 180°."],
[2,0,"The tray used for the preliminary (primary) impression is the:","Stock tray","Special tray","Record base","Occlusion rim","الـ preliminary impression بتتاخد بـ stock tray، وبعدها نعمل special tray للـ secondary (final) impression."],
[2,0,"A stock tray for edentulous patients has a handle that is:","L-shaped, at a right angle to the floor","In line with the floor","Absent","Long and straight","الـ edentulous tray ليها floor مدور وflanges قصيرة وhandle شكل L عشان ما يضغطش على الشفة."],
[2,1,"A stock tray should leave how much space for the impression material?","4–6 mm","1–2 mm","8–10 mm","No space","الـ stock tray لازم يسيب 4–6 mm حوالين الـ basal seat للمادة."],
[2,1,"The four windows made in the wax spacer of a special tray form:","Tissue stops","Handles","Flanges","Relief chambers","الـ windows بتطلع projections اسمها tissue stops، وظيفتها تحافظ على سمك المادة ثابت."],
[2,2,"Which impression technique is suitable for a flabby ridge?","Mucostatic (minimal pressure)","Mucocompressive","Selective pressure","Closed-mouth compression","الـ Mucostatic بتسجل بأقل ضغط (open mouth)، فمناسبة للـ flabby ridge عشان ما تتشوهش."],
[2,2,"Plaster-and-pumice boxing is used for alginate, rubber base and silicone because:","Beading wax does not adhere to these elastic materials","They set faster than plaster","They need no cast","They are rigid materials","الـ beading wax مش بيلزق في الـ elastic materials، فبنستخدم خليط plaster وpumice (1:1)."],
[3,0,"The primary function of the posterior palatal seal is:","Retention by increasing the effect of atmospheric pressure","Increasing vertical dimension","Locating the midline","Relieving the torus","الهدف الأساسي من الـ post dam هو الـ retention (seal بيزود تأثير الضغط الجوي) وكمان بيمنع دخول الأكل."],
[3,0,"The posterior vibrating line is located by asking the patient to say:","“Ah”","“Oo”","“Ee”","“Sss”","الـ posterior vibrating line بتظهر لما المريض يقول “Ah” متكررة، وبتبقى حوالي 2 mm بعد الـ fovea."],
[3,1,"The average thickness (depth) of the post dam is about:","1 mm","5 mm","3 mm","10 mm","متوسط عمق الـ post dam حوالي 1 mm، وعرضه 3–4 mm في أعرض نقطة."],
[3,1,"A Class III soft palate (sharp curvature) allows a:","Narrow posterior palatal seal","Broad posterior palatal seal","No posterior palatal seal","Seal on the movable part only","Class I = انحناء هادي = seal عريض، Class III = انحناء حاد = seal ضيق."],
[3,2,"Which post-damming technique is the LEAST accurate?","Arbitrary scraping of the master cast","Functional method with carding wax","Post-damming at the impression stage","Palpation with a T burnisher","الـ scraping على الـ cast أضعف طريقة، لأنها بتعتمد على خبرة الفني وبتسيب compressibility النسج للصدفة. الأفضل نعمل الـ post dam وقت الـ impression."],
[3,2,"Direct relief by scraping the final impression (1 mm) is applicable ONLY with:","Plaster of Paris","Zinc oxide and eugenol","Rubber base","Hydrocolloids","الـ scraping بيشتغل بس مع الـ plaster. مع الـ elastic materials بنستخدم tin foil على الـ cast."],
[4,0,"Retention is the resistance of the denture to displacement in:","A vertical direction away from the tissues","A horizontal direction","A rotational direction","All directions equally","Retention = مقاومة الإزاحة عمودياً بعيد عن النسج. أما الـ stability فهي ضد القوى الأفقية والدورانية."],
[4,0,"Stability is mainly the resistance against:","Horizontal and rotational forces","Gravity only","Vertical dislodging forces only","Saliva viscosity","Stability = مقاومة القوى الأفقية والـ rotational، وبتعتمد أساساً على الـ mechanical factors."],
[4,1,"Which of the following is NOT a physical factor of retention?","Presence of undercuts","Adhesion","Cohesion","Atmospheric pressure","الـ Undercut عامل mechanical. الـ physical هما adhesion وcohesion وinterfacial surface tension وatmospheric pressure وviscosity of saliva."],
[4,1,"Which palatal vault form is the most favorable for retention and stability?","U-shaped","V-shaped","Flat","Shallow","الـ U-shaped بتقاوم القوى العمودية والأفقية. الـ V بتقاوم الجانبية بس، والـ flat بتقاوم العمودية بس."],
[4,2,"Mandibular dentures are poorly retained by physical factors mainly because:","They have less surface area, are bathed in saliva and face strong tongue movements","Gravity displaces them","They have no peripheral seal","The mandible is always Class II","الـ lower بتعتمد على mechanical factors لأن مساحتها قليلة وغرقانة في اللعاب وحركة اللسان قوية. والجاذبية بتساعد الـ lower وبتزيح الـ upper."],
[4,2,"How does the height of the occlusal plane affect stability?","The higher the plane, the more leverage and the less stability","The higher the plane, the more stability","It has no effect","It affects retention only","كل ما الـ occlusal plane يعلى بتزيد الـ leverage وبتقل الـ stability."],
[5,0,"Rotation (hinge) movement of the TMJ takes place in the:","Lower (mandibular) compartment","Upper (maxillary) compartment","Both compartments equally","Outside the capsule","الـ rotation بتحصل بين رأس الـ condyle والسطح السفلي للـ disc، يعني الـ lower compartment."],
[5,0,"Translation movement of the TMJ takes place in the:","Upper (maxillary) compartment","Lower (mandibular) compartment","Temporomandibular ligament","Synovial membrane only","الـ translation بتحصل بين الـ disc والـ condyle كوحدة واحدة وبين الـ glenoid fossa، يعني الـ upper compartment."],
[5,1,"During lateral movement, the balancing condyle moves:","Forward, downward and inward","Backward, upward and outward","Only rotates around a vertical axis","It does not move","الـ balancing (non-working) condyle بيتحرك لقدام وتحت وللداخل. أما الـ working condyle فهو اللي بيلف حوالين vertical axis."],
[5,1,"In the first 4–8 mm of mouth opening, the movement is:","Pure rotation around the terminal hinge axis","Pure translation","Protrusion","Retrusion","في أول 4–8 mm بيحصل rotation بس في الـ lower compartment من غير translation."],
[5,2,"The Christensen phenomenon is:","A gap distally between posterior teeth/rims when the mandible protrudes","Lateral shift of the working condyle","A gap anteriorly during retrusion","The angle of the incisal path","لما الفك يتحرك لقدام بيحصل فراغ distal بين الـ rims. بنستخدمه في الـ protrusive record لضبط الـ condylar inclination."],
[5,2,"The main determinant of the incisal angle is:","The horizontal overlap (overjet)","The vertical overlap (overbite)","The condylar path","The Bennett angle","الـ horizontal overlap هو العامل الأساسي: كل ما زاد، الـ incisal angle قل."],
[0,1,"Which of the following is NOT an objective of complete denture construction?","Increasing the vertical dimension beyond normal","Restoration of masticatory efficiency","Correction of speech defects","Preservation of the remaining natural tissues","📌 السؤال بيسأل عن الشاذ وسط أهداف الـ complete denture.\n✅ الأهداف الخمسة: (1) استعادة كفاءة المضغ، (2) استعادة المظهر، (3) تصحيح النطق، (4) الحفاظ على النسج المتبقية، (5) رضا وراحة المريض.\n🧠 زيادة الـ vertical dimension عن الطبيعي مش هدف، بالعكس بتضر الـ TMJ والعضلات وبتتعب النسج.\n❌ باقي الاختيارات كلها أهداف أساسية في الكتاب."],
[0,1,"The denture border is:","The margin of the base at the junction between the polished and impression surfaces","The vertical part of the base extending from the cervical margin of the teeth","The part of the maxillary denture related to the palate","The surface that contacts the opposing teeth","📌 السؤال بيسأل عن تعريف الـ denture border.\n✅ هو حافة الـ base عند الالتقاء بين الـ polished surface والـ impression (fitting) surface.\n🧠 المصطلحات بتتلخبط بسهولة: الـ flange هو الجزء الرأسي من الـ base من رقبة السنة لحد الـ border، والـ palatal portion هو الجزء المقابل للحنك، والـ occlusal surface هو اللي بيلمس المقابل.\n❌ فكل اختيار من الباقيين تعريف لمصطلح تاني."],
[0,1,"Loss of teeth leads to a prematurely aged appearance mainly because of:","Loss of support to the lips and cheeks","Increase in vertical dimension","Excess bone formation","Hypertrophy of the masseter muscle","📌 السؤال بيسأل عن سبب شكل الشيخوخة المبكرة بعد فقد الأسنان.\n✅ السبب فقدان الدعم للشفايف والخدود، فالشفايف والخدود بتقع للداخل.\n🧠 الأسنان وعظم الـ alveolar هما اللي بيدعموا الأنسجة اللينة. بعد الفقد وامتصاص العظم الـ vertical dimension بتقل (مش بتزيد) والعظم بيضمر (مش بيزيد).\n❌ فالـ increase وexcess bone غلط لأنهم عكس اللي بيحصل."],
[1,1,"A SMALL torus palatinus is managed by:","Relieving the denture base over it","Surgical removal in all cases","Making the flange thicker over it","Ignoring it","📌 السؤال بيسأل عن التعامل مع torus palatinus صغير.\n✅ بنعمل relief في الـ denture base فوقه.\n🧠 الـ torus هو exostosis عظمي في منتصف الحنك، والـ mucosa فوقه رقيقة، فلو ما اتعملش relief بيحصل rocking للـ denture وألم. أما لو كبير ومنع الـ seating فبيتشال جراحياً.\n❌ الإزالة الجراحية للكبير بس، مش لكل الحالات."],
[1,2,"Why must the mandibular denture cover the retromolar pad?","It forms a soft tissue seal, acts as a cushion and ensures the buccal shelf is fully covered","It is the primary stress-bearing area","It contains the genial tubercles","It provides retention through a bony undercut","📌 السؤال بيسأل عن سبب تغطية الـ retromolar pad.\n✅ (1) بتضمن امتداد صح للـ denture وتغطية كاملة للـ buccal shelf، (2) بتعمل soft tissue seal بيساعد الـ retention، (3) إسفنجية فبتشتغل كـ cushion وتقلل الـ bone resorption.\n🧠 مهم: الـ pad نفسها مش بتدعم الـ denture، فمش primary stress bearing.\n❌ الـ genial tubercles في الناحية اللسانية عند الـ symphysis، ومفيش undercut عظمي هنا."],
[1,1,"Which landmark provides an undercut area for mechanical retention of the mandibular denture?","Lingual pouch","Buccal shelf","Masseteric notch","Retromolar pad","📌 السؤال بيسأل عن الـ landmark اللي فيه undercut بيساعد في الـ retention.\n✅ الـ lingual pouch: حدوده من ورا الـ palatoglossus، ومن قدام الـ mylohyoid، ومن جوه اللسان، ومن بره الجزء الإنسي للـ mandible.\n🧠 الـ undercut ده بيدي mechanical retention للـ lower denture.\n❌ الـ buccal shelf للدعم، والـ masseteric notch لازم الـ flange يميل هناك بسرعة للداخل عشان الـ masseter، والـ retromolar pad للـ seal والـ cushion."],
[2,1,"The preliminary impression is made of ___ and poured in ___ to obtain the study cast.","Alginate or impression compound / plaster of Paris","Zinc oxide and eugenol / dental stone","Rubber base / dental stone","Plaster / alginate","📌 السؤال بيسأل عن مادة الـ preliminary impression ومادة الـ cast.\n✅ الـ preliminary: impression compound أو alginate، والـ study cast من plaster of Paris.\n🧠 فرق مهم: الـ secondary (final) impression بتتاخد بـ plaster أو ZnO&E أو rubber base، والـ master cast بتتصب من dental stone لأنه أقوى.\n❌ باقي الاختيارات خلطت بين مواد الـ preliminary والـ secondary."],
[2,1,"In boxing an impression, the wall should extend about ___ above the highest point of the impression.","12 mm","3 mm","25 mm","No wall is needed","📌 السؤال بيسأل عن ارتفاع جدار الـ boxing.\n✅ حوالي 12 mm فوق أعلى نقطة في الـ impression.\n🧠 الـ boxing بيحافظ على حدود الـ impression وبيدي cast بسمك ثابت، وبيسمح بـ vibration يطلع الفقاعات، وبيسمح باستخدام mounting plate لإعادة تركيب الـ cast على الـ articulator.\n❌ 3 mm قليل جداً مش هيحمل الـ stone، ومفيش boxing معناها تخسر الـ borders."],
[2,2,"Which is an advantage of an acrylic special tray over a shellac tray?","It is more rigid and accepts thermoplastic border-molding material","It is flexible and easily bent to fit","It needs no construction steps","It is made directly in the mouth","📌 السؤال بيسأل عن ميزة الـ acrylic special tray على الـ shellac.\n✅ الـ acrylic أكثر rigidity وبتقبل border-molding material ومن السهل تتصنع وتتقص.\n🧠 الـ rigidity بتمنع الـ distortion أثناء الـ impression فالدقة أعلى.\n❌ الـ flexible غلط لأنه عيب، والـ special tray بتتصنع على الـ study cast في المعمل مش في الفم."],
[3,0,"The functions of the posterior palatal seal include:","Retention, preventing food ingress, reducing gagging and compensating for dimensional changes","Only increasing the vertical dimension","Providing primary stress bearing","Supporting the incisive papilla","📌 السؤال بيسأل عن وظائف الـ posterior palatal seal.\n✅ (1) الـ retention بزيادة تأثير الضغط الجوي (الوظيفة الأساسية)، (2) منع دخول الأكل تحت الـ base، (3) بتبقى مش محسوسة من اللسان فبتقلل الـ gagging، (4) بتعوض الـ dimensional changes في المادة.\n❌ مالهاش علاقة بالـ vertical dimension ولا الـ stress bearing."],
[3,2,"On the upper cast, relief should NOT encroach on the crest of the ridge EXCEPT over the:","Incisive papilla","Tuberosities","Rugae","Torus palatinus","📌 السؤال بيسأل عن الاستثناء في شكل الـ relief.\n✅ الـ relief في الـ upper cast شكله pear-shaped وأعرض جزء فيه قدام، ومايعديش على الـ crest غير فوق الـ incisive papilla.\n🧠 السبب إن الـ papilla قريبة من الـ crest بعد الـ resorption، وفوقها nasopalatine nerves وvessels فالضغط بيسبب burning.\n❌ الباقي مش فوق الـ crest."],
[3,1,"Which are SENSITIVE areas in the mandible relieved mainly for the patient’s comfort?","Mental foramen, thin crest of the lower ridge and sharp mylohyoid ridge","Median raphe and torus palatinus","Retromolar pad and buccal shelf","Incisive papilla and rugae","📌 السؤال بيسأل عن الـ sensitive areas في الفك السفلي.\n✅ الـ mental foramen، وفوق الـ crest لو رفيع، والـ mylohyoid ridge لو حاد.\n🧠 الـ relief نوعين: hard areas (مثلاً raphe وtorus والـ knife-edge ridge) بتتعمل عشان الـ rocking، وsensitive areas بتتعمل للراحة.\n❌ الـ raphe والـ papilla والـ rugae في الفك العلوي، والـ buccal shelf لازم يتغطى ويدعم."],
[4,1,"Which of the following is a CONTRAINDICATION for denture adhesives?","Ill-fitting dentures","Xerostomia","Severely resorbed ridge","Public speakers who need excellent retention","📌 السؤال بيسأل عن موانع استخدام الـ adhesives.\n✅ الـ ill-fitting denture مانع، لأن الصح إننا نعالج المشكلة (reline أو denture جديد) مش نغطيها.\n🧠 موانع تانية: وجود ulcers، وسوء النظافة، وحساسية للمنتج. أما الاستخدامات: الـ xerostomia والـ severe resorption والـ jaw resection والمتحدثين والموسيقيين.\n❌ الباقي كلهم indications."],
[4,1,"The effectiveness of atmospheric pressure in retaining an upper denture depends mainly on:","A perfect peripheral seal and the surface area covered","The viscosity of saliva only","Gravity","Tongue size","📌 السؤال بيسأل عن شرط فعالية الضغط الجوي.\n✅ لازم يبقى فيه seal محكم حوالين كل الـ border، ومساحة تغطية كبيرة.\n🧠 لما الـ denture تتركب بيخرج الهوا من تحتها فيبقى الضغط على السطح الـ polished أكبر من الـ fitting، والفرق ده بيعمل قوة تثبت الـ denture. لو الـ seal اتكسر الفعالية بتضيع.\n❌ باقي العوامل مش الشرط الأساسي."],
[4,2,"Which arch relationship usually gives poor retention of the mandibular denture?","Angle Class II (small mandible, small surface area)","Angle Class I","Angle Class III","All give the same retention","📌 السؤال بيسأل عن تأثير الـ arch relationship على الـ retention.\n✅ الـ Class II بتبقى فيها mandible صغيرة ومساحة قليلة فالـ retention ضعيفة.\n🧠 القاعدة: الـ arch الأصغر مشكلته stability وretention، لأن العوامل الفيزيائية بتتناسب طردياً مع المساحة.\n❌ الـ Class I هي العلاقة الطبيعية."],
[5,1,"Border movements differ from intra-border movements in that they are:","Repeatable and reproducible","Non-repeatable","Performed inside the envelope of motion","Possible only in edentulous patients","📌 السؤال بيسأل عن الفرق بين الـ border والـ intra-border movements.\n✅ الـ border movements بتتبع حدود الـ envelope of motion (Posselt) وهي repeatable وreproducible.\n🧠 عشان كده بنستخدمها في تسجيل حركات الفك. أما الـ intra-border فجوه الـ envelope وغير قابلة للتكرار.\n❌ باقي الاختيارات وصف للـ intra-border أو غلط."],
[5,2,"Lateral movement of the mandible to the RIGHT is produced by contraction of the:","Left lateral pterygoid muscle","Right lateral pterygoid muscle","Both medial pterygoids","Masseter only","📌 السؤال بيسأل عن العضلة المسؤولة عن الحركة الجانبية.\n✅ لما الـ lateral pterygoid في جانب بتنقبض، الفك بيتحرك للجانب المعاكس، فالحركة لليمين سببها الـ left lateral pterygoid.\n🧠 والجهة اللي الفك يتحرك ناحيتها اسمها working side، والعكس balancing side.\n❌ الـ right lateral pterygoid تحرك الفك لليسار."],
[5,2,"The Bennett angle is:","The angle at which the non-working condyle moves inward in lateral movement, measured against the sagittal plane","The angle between the incisal path and the horizontal plane","The angle between the condylar path and the horizontal plane in protrusion","The angle at the apex of the Gothic arch","📌 السؤال بيسأل عن تعريف الـ Bennett angle.\n✅ هي زاوية حركة الـ non-working (balancing) condyle للداخل أثناء الحركة الجانبية، وبتتقاس مقابل الـ sagittal plane.\n🧠 الـ Bennett movement هو الـ lateral bodily shift للفك.\n❌ الاختيار التاني هو الـ incisal angle، والتالت هو الـ horizontal condylar path angle، والرابع هو تتبع الـ Gothic arch."],
[0,0,'The art and science of supplying, fitting and servicing artificial replacements for missing parts of the human body is:','Prosthetics','Prosthodontics','Edentulism','Immediate prosthesis','📌 السؤال بيسأل عن المصطلح العام (أي جزء من الجسم).\n✅ Prosthetics.\n🧠 الـ Prosthesis هو البديل نفسه (عين، رجل، دراع). أما Prosthodontics فهو فرع طب الأسنان بس: تعويض الأسنان والنسج المحيطة لاستعادة الوظيفة.\n❌ Edentulism معناها فقد الأسنان، مش علم.'],
[0,0,'A condition in which ALL natural teeth are absent from the oral cavity is:','Completely edentulous','Dentulous','Partially edentulous','Immediate','📌 السؤال عن حالة فقد كل الأسنان.\n✅ Completely edentulous.\n🧠 Dentulous = كل الأسنان موجودة، Partially edentulous = فقد بعضها، Completely edentulous = فقد كلها.\n❌ Immediate ده نوع denture مش حالة فم.'],
[0,0,'A denture that replaces one or more, but not all, natural teeth is a:','Partial denture','Complete denture','Immediate denture','Overlay base','📌 السؤال عن الفرق بين partial وcomplete.\n✅ Partial denture، وبتتدعم بالأسنان و/أو الـ mucosa وممكن تبقى fixed أو removable.\n🧠 الـ Complete بتعوض كل الأسنان (في الفك العلوي و/أو السفلي).\n❌ الـ Immediate ده توقيت التركيب (قبل الخلع) مش عدد الأسنان.'],
[0,0,'The two main components of a complete denture are:','Denture base and artificial teeth','Flanges and borders','Polished and fitting surfaces','Occlusal rims and teeth','📌 السؤال عن الـ components (الأجزاء الأساسية).\n✅ الـ denture base والـ artificial teeth.\n🧠 الـ base بيرتكز على النسج والأسنان الصناعية متثبتة عليه. أما الـ border والـ flange فتفاصيل جوه الـ base، والـ polished/fitting أسطح مش أجزاء.\n❌ الاختيارات التانية أجزاء فرعية أو أسطح.'],
[0,1,'The labial flange of the denture occupies the:','Labial vestibule','Lingual sulcus','Buccal vestibule','Palate','📌 السؤال عن مكان الـ labial flange.\n✅ الـ labial vestibule وبتتعلق بالشفة.\n🧠 الـ buccal flange في الـ buccal vestibule (الخد)، والـ lingual flange في الـ lingual sulcus (اللسان، في الـ lower بس). والـ palatal portion للـ upper.\n❌ الباقي أماكن flanges تانية.'],
[0,1,'The lingual flange (mandibular denture) occupies the:','Lingual sulcus','Labial vestibule','Buccal vestibule','Palatal vault','📌 السؤال عن مكان الـ lingual flange.\n✅ الـ lingual sulcus (جنب اللسان).\n🧠 اسم الـ flange بيتحدد بالمكان اللي بتقابله: labial للشفة، buccal للخد، lingual للسان. والـ palatal portion جزء من الـ upper denture.\n❌ الباقي مرتبطين بـ flanges غير lingual.'],
[0,1,'The part of the denture that makes contact with the opposing dentition is the:','Occlusal surface','Polished surface','Fitting surface','Denture border','📌 السؤال عن السطح اللي بيلمس الأسنان المقابلة.\n✅ الـ Occlusal surface.\n🧠 ثلاث أسطح: Polished (خارجي، بيشمل أسطح الأسنان الخدية واللسانية)، Occlusal (التلامس)، Fitting (على النسج).\n❌ الـ border مش سطح، هو حافة الـ base.'],
[0,1,'Which of the following is a CLINICAL step (done in the presence of the patient)?','Final impression','Pouring of the master cast','Construction of occlusion blocks','Flasking','📌 السؤال عكس سؤال المعمل: عايز الخطوة الإكلينيكية.\n✅ الـ Final impression بتتاخد من المريض.\n🧠 الـ pouring وconstruction of blocks وflasking كلها خطوات معملية بتتعمل من غير المريض.\n❌ فاتوا على المعمل.'],
[0,2,'Which pair consists of BOTH laboratory steps?','Flasking and packing of acrylic resin','Try-in and jaw relation registration','Final impression and facebow index','Examination and selection of teeth','📌 السؤال عايز زوج خطوات معملية بالكامل.\n✅ Flasking وpacking acrylic، من خطوات الـ processing بالمعمل.\n🧠 الـ try-in وjaw relation وfinal impression وexamination كلها إكلينيكية. الـ facebow index برضه بيتاخد من المريض.\n❌ كل اختيار تاني فيه خطوة إكلينيكية.'],
[0,0,'Chewing food and mixing it with saliva is the first step in:','Digestion','Speech','Facial support','Bone resorption','📌 السؤال عن أهمية الـ mastication.\n✅ الـ Digestion.\n🧠 فقد الأسنان بيقلل كفاءة المضغ وممكن يسبب اضطرابات هضمية. عشان كده restoration of masticatory efficiency هدف أول للـ complete denture.\n❌ الباقي وظايف تانية للأسنان.'],
[0,1,'Restoring the normal degree of jaw separation with dentures helps preserve the:','Temporomandibular joints','Incisive papilla','Retromolar pad','Parotid gland','📌 السؤال عن الحفاظ على النسج المتبقية.\n✅ الـ TMJs.\n🧠 بعد فقد الأسنان الفك بيقفل في أوضاع غير طبيعية فبتحصل شدّات مستمرة على المفاصل. الـ denture بترجع الـ vertical separation الطبيعي وبتقلل الـ alveolar atrophy.\n❌ الباقي مش مرتبط بالـ jaw separation.'],
[0,1,'Speech defects after tooth loss are corrected mainly by:','Proper placement of the artificial teeth','Increasing flange thickness','Using a thicker palate','Removing the rugae','📌 السؤال عن علاج مشاكل النطق.\n✅ وضع الأسنان الصناعية في مكانها الصحيح.\n🧠 الأسنان بتشارك في نطق أصوات معينة، فلو مكانها غلط النطق بيتأثر.\n❌ تخليظ الـ flange أو الـ palate بيزود المشكلة.'],
[0,2,'Prosthodontics is best defined as:','The branch of dentistry concerned with restoring and maintaining oral function by replacing missing teeth and surrounding structures with artificial devices','The replacement of any missing part of the human body','The condition in which all teeth are absent','A denture made before extraction','📌 السؤال عن تعريف علم الـ Prosthodontics.\n✅ هو فرع طب الأسنان للمحافظة على وظيفة الفم وتعويض الأسنان والنسج المحيطة بأجهزة صناعية.\n🧠 التعريف التاني (أي جزء من الجسم) هو Prosthetics، والتالت edentulous، والرابع immediate denture.\n❌ ده خلط بين المصطلحات.'],
[1,0,'The interpupillary line helps in orientation of the:','Anterior occlusal plane','Posterior occlusal plane','Hinge axis','Midline of the lower lip','📌 السؤال عن وظيفة الـ interpupillary line.\n✅ بتظبط الـ anterior occlusal plane (موازية للخط ده).\n🧠 الـ ala-tragus line بتظبط الـ posterior plane. الاتنين مع بعض يحددوا مستوى الإطباق.\n❌ الـ hinge axis بيتحدد بـ canthus-tragus line.'],
[1,1,'The canthus-tragus line is used to arbitrarily locate the:','Rotational (hinge) axis of the mandibular condyles','Posterior occlusal plane','Anterior occlusal plane','Vibrating line','📌 السؤال عن استخدام الـ canthus-tragus line.\n✅ بتحدد تقريباً الـ hinge axis (الـ arbitrary method).\n🧠 الطريقة الدقيقة هي الـ kinematic face bow. الخط ده بيتمد من الـ outer canthus لـ tragus.\n❌ الباقي أسطح أو خطوط تانية.'],
[1,0,'The primary stress-bearing area in the MAXILLARY arch is the:','Residual alveolar ridge (crest)','Rugae','Torus palatinus','Incisive papilla','📌 السؤال عن منطقة الدعم الأساسية في الـ upper.\n✅ الـ residual ridge، عريض ومدور ومغطى بنسيج ضام ليفي كثيف.\n🧠 الـ rugae بتعمل كـ secondary stress bearing. والـ torus والـ papilla بيتعملهم relief.\n❌ الاتنين الأخيرين مناطق relief.'],
[1,1,'Lack of relief over the median palatine raphe results in:','Rocking of the denture and possible midline fracture','Loss of the vertical dimension','Ulceration of the frenum','Gagging only','📌 السؤال عن نتيجة عدم عمل relief على الـ raphe.\n✅ الـ rocking وممكن midline fracture.\n🧠 الـ raphe طبقة mucoperiosteum رقيقة جداً فوق الـ suture، مفيهاش submucosa تقريباً، فالضغط عليها بيحرك الـ denture.\n❌ الباقي مالوش علاقة بالـ raphe.'],
[1,1,'The mental foramen lies between the roots of the:','First and second premolars','Canine and first premolar','Second premolar and first molar','Central and lateral incisors','📌 السؤال عن مكان الـ mental foramen.\n✅ بين جذور أول وتاني premolar.\n🧠 بيعدي منه mental nerve وvessels. مع الـ resorption الشديد بيبقى على الـ crest، فبنعمله relief لتجنب numbness الشفة السفلية.\n❌ الأماكن الأخرى غير صحيحة.'],
[1,2,'Angular cheilitis due to vitamin B12 deficiency is managed by:','Administration of vitamin B12','Increasing the vertical dimension','Repositioning the anterior teeth','Surgical removal of the commissure','📌 السؤال عن علاج السبب الغذائي.\n✅ إعطاء B12.\n🧠 الأسباب: edentulism طويل، vertical dimension ناقص، نقص B12، عدوى فطرية. أول اتنين بيتعالجوا بضبط الـ denture، والتالت بالـ B12.\n❌ الاختيارات التانية بتعالج الأسباب الميكانيكية.'],
[1,1,'Which frenum CONTAINS muscle fibers?','Buccal frenum','Labial frenum','Lingual frenum only','None of them','📌 السؤال عن الفرق التشريحي بين الـ frena.\n✅ الـ Buccal frenum بتحتوي على muscle fibers.\n🧠 الـ labial frenum طيّة mucosa من غير ألياف عضلية، فبتتعمل لها V-shaped notch في الـ flange.\n❌ الاختيارات التانية غلط.'],
[1,1,'The hamular (pterygomaxillary) notch lies between the:','Maxillary tuberosity and the pterygoid hamulus','Incisive papilla and the fovea','Hard palate and the tongue','Ramus and the retromolar pad','📌 السؤال عن حدود الـ hamular notch.\n✅ بين الـ maxillary tuberosity (قدام) والـ pterygoid hamulus (ورا).\n🧠 هو band من نسيج ضام رخو من غير عضلة، والـ posterior palatal seal بيمتد من notch لـ notch.\n❌ الباقي مناطق مختلفة.'],
[1,2,'The posterior vibrating line (“Ah line”) lies between:','The movable and immovable parts of the soft palate','The hard palate and the soft palate','The fovea and the incisive papilla','The tuberosity and the retromolar pad','📌 السؤال عن موقع الـ posterior vibrating line.\n✅ بين الجزء المتحرك وغير المتحرك من الـ soft palate.\n🧠 الـ anterior vibrating line هي اللي عند حدود الـ hard والـ soft palate. والـ posterior بتحدد نهاية الـ upper denture.\n❌ الاختيار الثاني ده الـ anterior line.'],
[1,2,'The mandibular denture should cover but NOT extend beyond the:','External oblique ridge','Mylohyoid ridge','Buccal frenum','Retromolar pad','📌 السؤال عن حد الامتداد على الـ external oblique ridge.\n✅ بنغطيها من غير ما نتعداها.\n🧠 لو عدّيناها الـ masseter (اللي بيلتصق على الـ ramus وألياف قدامية قريبة من الـ ridge) بيزحزح الـ denture.\n❌ الـ retromolar pad لازم تتغطى بالكامل.'],
[1,2,'The genial tubercles are attachments for the:','Genioglossus (upper) and geniohyoid (lower) muscles','Masseter and temporalis','Mylohyoid and buccinator','Orbicularis oris','📌 السؤال عن العضلات المرتبطة بالـ genial tubercles.\n✅ الـ genioglossus فوق والـ geniohyoid تحت.\n🧠 هما بروزين على السطح الداخلي جنب الـ symphysis، ومع resorption شديد بيقربوا من الـ crest ويحتاجوا relief.\n❌ الباقي عضلات تانية.']
];
var $=function(s){return document.querySelector(s)},app=$("#app"),ac;
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function AC(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();return ac}
function clap(){try{var c=AC(),n=Math.floor(c.sampleRate*.06),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);for(var k=0;k<45;k++){var s=c.createBufferSource();s.buffer=b;var f=c.createBiquadFilter();f.type="bandpass";f.frequency.value=1200+Math.random()*2500;var g=c.createGain();g.gain.value=.5+Math.random()*.5;s.connect(f);f.connect(g);g.connect(c.destination);s.start(c.currentTime+Math.random()*1.6)}}catch(e){}}
function buzz(){try{var c=AC(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type="sawtooth";o.frequency.setValueAtTime(220,t);o.frequency.linearRampToValueAtTime(110,t+.35);g.gain.setValueAtTime(.12,t);g.gain.linearRampToValueAtTime(0,t+.4);o.connect(g);g.connect(c.destination);o.start();o.stop(t+.4)}catch(e){}}
var list,i,score,cur;
function home(){
  var h='<h1>🦷 Complete Denture Quiz</h1><p class="sub">اختاري الشابتر (من 1 لـ 6) والأسئلة بتبدأ سهلة وبعدين وسط وبعدين صعبة</p>';
  h+='<button class="ch all" data-c="-1"><b>كل الشابترات 1–6</b><small>'+Q.length+' سؤال</small></button>';
  CH.forEach(function(n,k){var c=Q.filter(function(q){return q[0]==k}).length;h+='<button class="ch" data-c="'+k+'"><span><b>Chapter '+(k+1)+'</b> · <b>'+n+'</b></span><small>'+c+' أسئلة</small></button>'});
  app.innerHTML=h;
  app.querySelectorAll(".ch").forEach(function(b){b.onclick=function(){start(+b.dataset.c)}});
}
function start(c){
  cur=c;
  list=shuf(Q.filter(function(q){return c<0||q[0]==c})).sort(function(a,b){return a[1]-b[1]});
  i=0;score=0;show();
}
function show(){
  var q=list[i],opts=shuf([q[3],q[4],q[5],q[6]]);
  var h='<div class="top"><span>سؤال '+(i+1)+' من '+list.length+'</span><span>'+LV[q[1]]+'</span></div><div class="bar"><i style="width:'+(i/list.length*100)+'%"></i></div><div class="card"><p class="q"></p><div id="os"></div><div id="fb"></div></div><button class="back" id="bk">رجوع للقايمة</button>';
  app.innerHTML=h;
  app.querySelector(".q").textContent=q[2];
  var os=$("#os");
  opts.forEach(function(t){var b=document.createElement("button");b.className="o";b.textContent=t;b.onclick=function(){pick(b,t,q)};os.appendChild(b)});
  $("#bk").onclick=home;
}
function pick(b,t,q){
  var ok=t===q[3];
  document.querySelectorAll(".o").forEach(function(x){x.disabled=true;if(x.textContent===q[3])x.classList.add("ok")});
  if(!ok)b.classList.add("no");
  if(ok){score++;clap()}else buzz();
  var last=i==list.length-1;
  var fb=$("#fb");
  fb.innerHTML='<div class="fb '+(ok?"ok":"no")+'"><h3>'+(ok?"👏 برافو! إجابة صح":"❌ ولا يهمك يا كتكوتة 💛")+'</h3>'+(ok?"":'<div>الحل الصح:</div><div class="ans"></div>')+'<div><b>📘 الشرح:</b> <span class="ex"></span></div></div><button class="nx">'+(last?"شوفي النتيجة":"السؤال اللي بعده ←")+'</button>';
  if(!ok)fb.querySelector(".ans").textContent=q[3];
  fb.querySelector(".ex").textContent=q[7];
  fb.querySelector(".nx").onclick=function(){last?end():(i++,show())};
  fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function end(){
  var p=Math.round(score/list.length*100),m=p>=80?"ممتاز! انتي جاهزة 🔥":p>=50?"حلو! كمان شوية مراجعة وتبقي جامدة 💪":"ولا يهمك، راجعي الشرح وجربي تاني 💛";
  if(p>=50)clap();
  app.innerHTML='<div class="card"><div class="big">'+(p>=80?"🏆":p>=50?"👍":"📚")+'</div><p class="sc">'+score+' / '+list.length+' ('+p+'%)</p><p class="msg">'+m+'</p><button class="nx" id="re">إعادة الاختبار</button><button class="back" id="hm">رجوع للقايمة</button></div>';
  $("#re").onclick=function(){start(cur)};$("#hm").onclick=home;
}
home();
</script>
</body>
</html>
