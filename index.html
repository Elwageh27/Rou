issue-contacting surface only", "The surface contacting opposing dentition", "The inside of the impression"], "a": 0, "exp": "It is the external denture surface and includes facial, lingual and palatal surfaces facing cheeks, lips and tongue.", "level": "متوسط"}, {"q": "The occlusal surface:", "opts": ["Contacts the supporting tissues", "Makes contact with antagonists", "Is the denture border", "Is always smooth and nonfunctional"], "a": 1, "exp": "The occlusal surface is the part that contacts the opposing dentition.", "level": "صعب"}, {"q": "The fitting surface is also called:", "opts": ["Polished surface", "Basal or tissue or impression surface", "Occlusal surface", "Labial flange"], "a": 1, "exp": "The fitting surface is also known as the basal, tissue or impression surface.", "level": "صعب"}, {"q": "One objective of complete denture construction is restoration of:", "opts": ["Masticatory efficiency", "Hearing", "Vision", "Nasal airflow"], "a": 0, "exp": "Loss of teeth significantly affects mastication; dentures restore chewing efficiency.", "level": "صعب"}, {"q": "Loss of teeth can cause premature aging appearance mainly due to:", "opts": ["Excessive salivation", "Loss of lip and cheek support", "Increased tongue size", "Enlarged condyles"], "a": 1, "exp": "Loss of support can cause falling in of lips and cheeks and a senile appearance.", "level": "صعب"}, {"q": "Teeth are important for speech because they help:", "opts": ["Pronounce certain sounds", "Control saliva production", "Move the condyle", "Form the hard palate"], "a": 0, "exp": "Proper artificial tooth placement helps correct speech defects resulting from tooth loss.", "level": "صعب"}, {"q": "The clinical steps include:", "opts": ["Examination and diagnosis", "Deflasking", "Laboratory remounting", "Polishing only"], "a": 0, "exp": "Examination and diagnosis is the first listed clinical step; several other steps are laboratory procedures.", "level": "صعب"}]}, {"title": "Chapter 2 — Anatomy and Physiology", "questions": [{"q": "The ala-tragus line runs from the:", "opts": ["Ala of nose to tragus of ear", "Canthus to tragus", "Two eye pupils", "Chin to nose"], "a": 0, "exp": "The book defines it as an imaginary line from the ala of the nose to the tragus; it helps orient the posterior occlusal plane.", "level": "سهل"}, {"q": "The interpupillary line helps orient the:", "opts": ["Posterior occlusal plane", "Anterior occlusal plane", "Mandibular hinge axis", "Posterior palatal seal"], "a": 1, "exp": "It is an imaginary line between the pupils when the patient looks straight forward and helps orient the anterior occlusal plane.", "level": "سهل"}, {"q": "The canthus-tragus line is used to locate the:", "opts": ["Incisive papilla", "Rotational axis of mandibular condyles", "Fovea palatinae", "Mental foramen"], "a": 1, "exp": "It runs from the outer canthus to the tragus and is used to arbitrarily locate the rotational axis of the mandibular condyles.", "level": "سهل"}, {"q": "The nasolabial sulcus runs from the ala of the nose to the:", "opts": ["Chin", "Corner of the mouth", "Tragus", "Lower border of mandible"], "a": 1, "exp": "It is a crease running laterally and downward from the ala of the nose to the corner of the mouth.", "level": "سهل"}, {"q": "The vermilion border is the transition between:", "opts": ["Hard and soft palate", "Lip mucosa and facial skin", "Tongue and floor of mouth", "Bone and mucosa"], "a": 1, "exp": "It is the transitional epithelium between the mucous membrane of the lip and the skin of the face.", "level": "سهل"}, {"q": "The labio-mental sulcus is found between the:", "opts": ["Upper lip and nose", "Mandibular lip and chin", "Cheek and ridge", "Tongue and floor of mouth"], "a": 1, "exp": "It is a horizontal depression between the mandibular lip and chin; its curvature reflects jaw relationship.", "level": "سهل"}, {"q": "The point where maxillary and mandibular lips meet is the:", "opts": ["Modiolus", "Angle of mouth/commissure", "Fovea palatina", "Incisive papilla"], "a": 1, "exp": "The angle of the mouth is the meeting point of the maxillary and mandibular lips.", "level": "سهل"}, {"q": "The modiolus is located:", "opts": ["Above and distal to the nose", "Below and distal to the angle of mouth", "At the mid-palatal raphe", "On the mandibular ridge crest"], "a": 1, "exp": "It is a point of meeting of facial muscle fibers, located below and distal to the angle of the mouth.", "level": "متوسط"}, {"q": "The primary stress-bearing area in the maxilla is generally the:", "opts": ["Median palatine raphe", "Residual alveolar ridge", "Incisive papilla", "Palatal rugae"], "a": 1, "exp": "The residual alveolar ridge is described as the primary stress-bearing area in the maxillary arch.", "level": "متوسط"}, {"q": "The maxillary tuberosity is located at the:", "opts": ["Anterior midline", "Distal end of the maxillary ridge", "Mandibular premolar region", "Floor of mouth"], "a": 1, "exp": "It is a rounded bony prominence at the distal end of the maxillary ridge.", "level": "متوسط"}, {"q": "The incisive papilla should be relieved to avoid:", "opts": ["Tongue biting", "Interference with blood and nerve supply causing burning sensation", "Condylar displacement", "Gag reflex"], "a": 1, "exp": "The book notes that relief prevents interference with blood and nerve supply that may cause a burning sensation.", "level": "متوسط"}, {"q": "Palatal rugae are associated with:", "opts": ["Speech and tongue function", "Condylar rotation", "Salivary duct openings", "Mandibular nerve exit"], "a": 0, "exp": "They assist tongue observation and help form a perfect seal when the tongue is pressed against the palate.", "level": "متوسط"}, {"q": "Fovea palatinae are openings of ducts of:", "opts": ["Major salivary glands", "Minor salivary glands", "Parotid gland only", "Sublingual gland only"], "a": 1, "exp": "They are small pits on either side of the midline near the hard/soft palate junction and represent openings of minor salivary gland ibrating line lies between the movable and immovable parts of the soft palate.", "level": "صعب"}]}, {"title": "Chapter 3 — Impression Trays and Impression Techniques", "questions": [{"q": "A dental impression is:", "opts": ["A positive reproduction", "A negative reproduction of teeth and adjacent structures", "A finished denture", "A type of articulator"], "a": 1, "exp": "The book defines a dental impression as a negative reproduction from which a positive likeness or cast can be made.", "level": "سهل"}, {"q": "An impression tray is used to:", "opts": ["Carry, confine and control impression material", "Polish the denture", "Set condylar guidance", "Measure vertical dimension"], "a": 0, "exp": "The tray carries, confines and controls impression material while making an impression.", "level": "سهل"}, {"q": "A cast is:", "opts": ["A negative reproduction", "A positive reproduction of tissues", "A wax spacer", "A tray handle"], "a": 1, "exp": "A cast is the positive reproduction of the form of tissues of the upper or lower arch.", "level": "سهل"}, {"q": "A preliminary impression is usually made with a:", "opts": ["Special tray", "Stock tray", "Record base", "Articulator"], "a": 1, "exp": "The comparison table states that a stock tray is used for the preliminary impression.", "level": "سهل"}, {"q": "The secondary impression is used to record:", "opts": ["Only tooth shade", "Fine details of the arch", "Facial height only", "The condylar axis"], "a": 1, "exp": "The secondary impression records fine details of the arch.", "level": "سهل"}, {"q": "The resulting cast from a preliminary impression is the:", "opts": ["Master cast", "Study/primary cast", "Refractory cast", "Remount cast"], "a": 1, "exp": "The preliminary impression produces a plaster study (primary) cast.", "level": "سهل"}, {"q": "The resulting cast from a secondary impression is the:", "opts": ["Study cast", "Master cast", "Diagnostic wax-up", "Opposing cast"], "a": 1, "exp": "The secondary impression is poured  each patient", "A tray used only for children", "A tray for pouring casts"], "a": 1, "exp": "Special/custom trays are individually constructed for each patient.", "level": "متوسط"}, {"q": "One advantage of a special tray is:", "opts": ["More impression material is required", "Less impression material is used", "It cannot be adjusted", "It is less accurate"], "a": 1, "exp": "The special tray fits the arch accurately and reduces bulk of impression material and dimensional changes.", "level": "صعب"}, {"q": "Which material is listed for special tray construction?", "opts": ["Shellac base plate", "Self-curing/light-cured acrylic resin", "Cast or swaged metal", "All of the above"], "a": 3, "exp": "The book lists shellac base plate, self-curing or light-cured acrylic resin, and cast or swaged metal.", "level": "صعب"}, {"q": "A wax spacer helps provide:", "opts": ["Uneven thickness", "Even thickness of impression material", "A thicker handle", "Condylar movement"], "a": 1, "exp": "The spacer creates an even thickness and helps avoid dimensional changes throughout the impression.", "level": "صعب"}, {"q": "Boxing an impression means:", "opts": ["Removing the impression borders", "Building vertical walls around the impression", "Making an occlusal rim", "Mounting casts"], "a": 1, "exp": "Boxing builds vertical walls, usually in wax, around the impression to obtain the desired cast base and preserve borders.", "level": "صعب"}, {"q": "One advantage of boxing is:", "opts": ["Loss of impression borders", "A cast with predetermined base thickness", "More air bubbles", "Greater material waste"], "a": 1, "exp": "Boxing preserves impression borders and allows a cast with predetermined base thickness.", "level": "صعب"}, {"q": "In the wax bead boxing method, the bead is placed approximately:", "opts": ["3 mm from and parallel to the periphery", "10 mm inside the impression", "Directly on the ridge crest", "At the tray handle only"], "a": 0, "exp": "The book describes placing a wax bead const $=id=>document.getElementById(id);
let questions=[],idx=0,correct=0,wrong=0,answered=false,lastSelection=-1,modeNow="all",choiceNow="0";
BANK.forEach((c,i)=>{const o=document.createElement("option");o.value=i;o.textContent=c.title;$("chapter").append(o)});
function build(chapterIndex,mode){
 let arr=[];
 if(chapterIndex==="all"){BANK.forEach((c,ci)=>c.questions.forEach((q,qi)=>arr.push({...q,chapter:c.title,sourceIndex:qi})))}
 else {let c=BANK[Number(chapterIndex)];arr=c.questions.map(q=>({...q,chapter:c.title}))}
 if(mode==="easy")arr=arr.filter(q=>q.level==="سهل");
 if(mode==="medium")arr=arr.filter(q=>q.level==="متوسط");
 if(mode==="hard")arr=arr.filter(q=>q.level==="صعب");
 return arr;
}
function start(ch=$("chapter").value,mode=$("mode").value){
 modeNow=mode;choiceNow=ch;questions=build(ch,mode);idx=0;correct=0;wrong=0;
 $("setup").classList.add("hidden");$("result").classList.add("hidden");$("quiz").classList.remove("hidden");
 render();
}
function render(){
 answered=false;lastSelection=-1;const q=questions[idx];
 $("chapterName").textContent=q.chapter;$("count").textContent=`${idx+1} / ${questions.length}`;
 $("bar").style.width=`${idx/questions.length*100}%`;$("level").textContent="المستوى: "+q.level;
 $("scoreLive").textContent="الصح: "+correct;$("wrongLive").textContent="الغلط: "+wrong;
 $("question").textContent=q.q;$("options").innerHTML="";$("feedback").className="feedback";$("feedback").innerHTML="";
 $("next").disabled=true;$("next").textContent=idx===questions.length-1?"عرض النتيجة":"السؤال التالي";
 q.opts.forEach((opt,i)=>{let label=document.createElement("label");label.className="option";label.innerHTML=`<input type="radio" name="answer" value="${i}"><span>${String.fromCharCode(65+i)}. ${escapeHtml(opt)}</span>`;label.addEventListener("click",()=>choose(i));$("options").append(label)});
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function choose(i){
 if(answered)return;answered=true;lastSelection=i;const q=questions[idx],ok=i===q.a;
 if(ok)correct++;else wrong++;
 document.querySelectorAll(".option").forEach((el,n)=>{el.querySelector("input").disabled=true;if(n===q.a)el.classList.add("correct");if(n===i&&!ok)el.classList.add("wrong")});
 const f=$("feedback");f.className="feedback "+(ok?"good":"bad");
 f.innerHTML=ok?`<strong>👏 برافو! إجابة صحيحة — عاش!</strong><div class="explain">${escapeHtml(q.exp)}</div>`:`<strong>ولا يهمك يا كتكوته ❤️</strong><div>الإجابة الصحيحة: <b>${String.fromCharCode(65+q.a)}. ${escapeHtml(q.opts[q.a])}</b></div><div class="explain">${escapeHtml(q.exp)}</div>`;
 $("scoreLive").textContent="الصح: "+correct;$("wrongLive").textContent="الغلط: "+wrong;$("next").disabled=false;
 if($("sound").value==="on")playSound(ok);
}
function playSound(ok){
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),now=c.currentTime;
  if(ok){
   // Short crowd-like applause: layered soft noise bursts with varied timing.
   for(let k=0;k<18;k++){let dur=.045+Math.random()*.055,buf=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate),d=buf.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.exp(-j/d.length*5);
    let src=c.createBufferSource(),gain=c.createGain(),filter=c.createBiquadFilter();src.buffer=buf;filter.type="highpass";filter.frequency.value=700+Math.random()*1800;gain.gain.setValueAtTime(.0001,now+k*.055);gain.gain.exponentialRampToValueAtTime(.10,now+k*.055+.008);gain.gain.exponentialRampToValueAtTime(.0001,now+k*.055+dur);src.connect(filter);filter.connect(gain);gain.connect(c.destination);src.start(now+k*.055);src.stop(now+k*.055+dur)}
   setTimeout(()=>c.close(),1800);
  }else{
   [220,164].forEach((hz,n)=>{let o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=hz;g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.07,now+.02);g.gain.exponentialRampToValueAtTime(.0001,now+.22);o.connect(g);g.connect(c.destination);o.start(now);o.stop(now+.24)});setTimeout(()=>c.close(),500);
  }
 }catch(e){}
}
function finish(){
 $("quiz").classList.add("hidden");$("result").classList.remove("hidden");
 let pct=Math.round(correct/questions.length*100);$("finalScore").textContent=pct+"%";
 $("summary").textContent=`إجابات صحيحة: ${correct} من ${questions.length} • إجابات خاطئة: ${wrong}. ${pct>=85?"ممتاز جدًا!":pct>=65?"شغل حلو، راجع الأسئلة اللي غلطت فيها.":"محتاج مراجعة بسيطة، جرّب مرة تانية وهتتحسن."}`;
 $("bar").style.width="100%";
}
$("start").onclick=()=>start();$("allCh").onclick=()=>start("all","mixed");
$("next").onclick=()=>{if(!answered)return;if(idx<questions.length-1){idx++;render()}else finish()};

</script></body></html>
